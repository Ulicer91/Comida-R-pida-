<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastBites | Comida Rápida Online</title>
    <style>
        /* Estilos CSS - Aquí damos estilo a nuestra tienda */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        header {
            background-color: #ff4500; /* Un naranja vibrante */
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        #cart-button {
            background-color: #fff;
            color: #ff4500;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #cart-button:hover {
            background-color: #ffe8e0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .product-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            width: 250px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #eee; /* Placeholder */
        }
        .product-card h3 {
            margin: 10px 0;
            color: #ff4500;
        }
        .product-card p {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-card button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        .product-card button:hover {
            background-color: #e03d00;
        }

        /* Estilos para el carrito (modal simple) */
        .cart-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 400px;
            width: 90%;
        }
        .cart-modal h2 {
            margin-top: 0;
            color: #ff4500;
            border-bottom: 2px solid #ff4500;
            padding-bottom: 10px;
        }
        .cart-items {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .cart-items li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-total {
            font-size: 1.3em;
            font-weight: bold;
            text-align: right;
            margin: 20px 0;
        }
        .cart-modal button {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin-right: 10px;
        }
        .cart-modal button.secondary {
            background-color: #6c757d;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍔 FastBites</h1>
        <button id="cart-button">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </header>

    <main class="container" id="product-container">
        <!-- Los productos se cargarán aquí con JavaScript -->
    </main>

    <!-- Modal del Carrito -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-modal" id="cart-modal">
        <h2>Tu Pedido</h2>
        <ul class="cart-items" id="cart-items-list">
            <li>El carrito está vacío</li>
        </ul>
        <div class="cart-total">
            Total: <span id="cart-total-price">$0.00</span>
        </div>
        <button id="checkout-btn">Pagar</button>
        <button class="secondary" id="close-cart">Seguir Comprando</button>
    </div>

    <script>
        // --- JavaScript - La lógica de nuestra tienda ---

        // Datos de los productos (simulando una base de datos)
        const products = [
            { id: 1, name: 'Hamburguesa Clásica', description: 'Carne, queso, lechuga, tomate y nuestra salsa especial.', price: 8.99, image: '🍔' },
            { id: 2, name: 'Pizza Margarita', description: 'Salsa de tomate, mozzarella fresca y albahaca.', price: 12.50, image: '🍕' },
            { id: 3, name: 'Ensalada César', description: 'Pechuga de pollo, lechuga romana, crutones y aderezo César.', price: 9.75, image: '🥗' },
            { id: 4, name: 'Patatas Fritas', description: 'Crujientes patatas fritas con sal y acompañadas de ketchup.', price: 3.50, image: '🍟' },
            { id: 5, name: 'Aros de Cebolla', description: 'Aros de cebolla empanados, crujientes por fuera y tiernos por dentro.', price: 4.25, image: '🧅' },
            { id: 6, name: 'Refresco de Cola', description: 'Bebida bien fría para acompañar tu comida.', price: 2.00, image: '🥤' }
        ];

        let cart = [];

        // --- Funciones para renderizar la tienda y el carrito ---
        function displayProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; // Limpiar contenedor
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div style="font-size: 5rem; line-height: 1;">${product.image}</div>
                    <h3>${product.name}</h3>
                    <p>$${product.price.toFixed(2)}</p>
                    <button onclick="addToCart(${product.id})">Añadir al Carrito</button>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                const existingItem = cart.find(item => item.id === productId);
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }
                updateCartUI();
                alert(`${product.name} añadido al carrito!`); // Feedback simple
            }
        }

        function updateCartUI() {
            // Actualizar contador del header
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = totalItems;

            // Actualizar lista del modal
            const cartList = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                cartList.innerHTML = '<li>El carrito está vacío</li>';
            } else {
                cartList.innerHTML = cart.map(item => `
                    <li>
                        <span>${item.name} (x${item.quantity})</span>
                        <span>$${(item.price * item.quantity).toFixed(2)}</span>
                    </li>
                `).join('');
            }

            // Actualizar total
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total-price').textContent = `$${totalPrice.toFixed(2)}`;
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // --- Event Listeners para el modal ---
        document.getElementById('cart-button').addEventListener('click', () => {
            document.getElementById('cart-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        });

        document.getElementById('close-cart').addEventListener('click', () => {
            document.getElementById('cart-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        });

        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('cart-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        });

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Tu carrito está vacío. ¡Añade algún producto!');
                return;
            }
            alert('¡Gracias por tu compra! (Simulación)');
            cart = []; // Vaciar carrito
            updateCartUI();
            document.getElementById('cart-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        });

        // Iniciar la tienda mostrando los productos
        displayProducts();
        // Asegurar que las funciones sean globales para los botones "onclick"
        window.addToCart = addToCart;
    </script>
</body>
</html>
